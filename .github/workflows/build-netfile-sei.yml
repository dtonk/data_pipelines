name: build-netfile-sei

on:
  workflow_dispatch: {}   # manual only — SEI filings don't change often enough to warrant a schedule

permissions:
  contents: read   # least privilege; the job only reads code and writes to Reliquery

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: warehouse.duckdb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b   # v5.3.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_netfile_sei.py
      - run: dbt run --profiles-dir . --select stg_netfile_sei_transactions netfile_sei_holdings
      - run: python scripts/publish_reliquery.py netfile_sei_holdings
        env:
          DSP_TOKEN: ${{ secrets.DSP_TOKEN }}
