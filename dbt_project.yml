name: 'data_pipelines'
version: '1.0.0'
config-version: 2

profile: 'data_pipelines'

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Staging = thin views over the raw sources; marts = materialized tables that
# publish_reliquery.py publishes. Any mart tagged `reliquery` is published.
models:
  data_pipelines:
    staging:
      +materialized: view
    marts:
      +materialized: table

vars:
  # SF city job postings (SmartRecruiters via careers.sf.gov) — mirrors the
  # filter in the separate city_job_alerts repo's config.json. Empty
  # city_job_classes matches all classes of the given employment types.
  city_job_employment_types: ["Permanent Exempt", "Temporary Exempt"]
  city_job_classes:
    - "1042"
    - "1043"
    - "1044"
    - "1052"
    - "1053"
    - "1054"
    - "1063"
    - "1064"
    - "1070"
    - "1071"
    - "1073"
    - "1080"
    - "9976"
    - "9978"
    - "0931"
    - "0932"
    - "0933"
    - "0941"
    - "0942"
    - "0943"
    - "0951"
    - "0952"
    - "0953"
    - "0954"
    - "0955"
